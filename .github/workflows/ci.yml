name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Regression guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # The suite reserves a fresh local port and verifies this repository's title.
      - name: Run regression guards
        run: npm test
