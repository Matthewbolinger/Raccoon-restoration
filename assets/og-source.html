<!DOCTYPE html>
<!-- Source for assets/og.png (1200x630 social share card).
     Regenerate: open at exactly 1200x630 and screenshot (see README). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 380 700; src: url("fonts/fraunces-roman.woff2") format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 380 700; src: url("fonts/fraunces-italic.woff2") format("woff2"); }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #F7F2E9;
    font-family: "Fraunces", Georgia, serif;
    color: #1B1610;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px 56px;
    position: relative;
  }
  .rule { position: absolute; left: 72px; right: 72px; top: 150px; height: 1px; background: rgba(27,22,16,.25); }
  .eyebrow {
    font-family: ui-monospace, Menlo, monospace; font-size: 20px;
    letter-spacing: .28em; text-transform: uppercase; color: #A24E1B;
  }
  .brand { display: flex; align-items: center; gap: 28px; }
  .title { font-size: 92px; font-weight: 560; line-height: 1.02; letter-spacing: -.015em; margin-top: 8px; }
  .title em { font-style: italic; color: #A24E1B; }
  .foot { display: flex; justify-content: space-between; align-items: baseline;
          font-family: ui-monospace, Menlo, monospace; font-size: 19px; letter-spacing: .14em;
          text-transform: uppercase; color: #6E6353; }
  .foot b { color: #A24E1B; }
  .corner { position: absolute; width: 26px; height: 26px; }
  .tl { top: 26px; left: 26px; border-top: 3px solid #1B1610; border-left: 3px solid #1B1610; }
  .tr { top: 26px; right: 26px; border-top: 3px solid #1B1610; border-right: 3px solid #1B1610; }
  .bl { bottom: 26px; left: 26px; border-bottom: 3px solid #1B1610; border-left: 3px solid #1B1610; }
  .br { bottom: 26px; right: 26px; border-bottom: 3px solid #1B1610; border-right: 3px solid #1B1610; }
</style>
</head>
<body>
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
  <div class="brand">
    <svg width="86" height="86" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path fill="#1B1610" d="M12 54 L12 26 L22 10 L32 21 L42 10 L52 26 L52 54 Z"/>
      <path fill="#A24E1B" d="M12 29 H52 V42 H12 Z"/>
      <circle fill="#F7F2E9" cx="24" cy="35.5" r="3.4"/>
      <circle fill="#F7F2E9" cx="40" cy="35.5" r="3.4"/>
      <path fill="#F7F2E9" d="M28.6 54 V47.4 A3.4 3.4 0 0 1 35.4 47.4 V54 Z"/>
    </svg>
    <span class="eyebrow">Raccoon Restoration · Est. Barrington, IL</span>
  </div>
  <div class="rule"></div>
  <div class="title">Your home deserves better<br>than <em>“good as new.”</em></div>
  <div class="foot">
    <span>Roofing · Siding · Interiors · Claim Advocacy</span>
    <span><b>A+</b> BBB Accredited</span>
  </div>
</body>
</html>
