<!DOCTYPE html>
<!-- Source for assets/og.png (1200x630 social share card).
     Regenerate: open at exactly 1200x630 and screenshot (see README). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: "Archivo"; font-weight: 100 900; font-stretch: 62% 125%; src: url("fonts/archivo.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400 600; src: url("fonts/inter.woff2") format("woff2"); }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0E1114;
    background-image:
      linear-gradient(rgba(244,245,246,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,245,246,.045) 1px, transparent 1px);
    background-size: 68px 68px;
    color: #F4F5F6;
    font-family: "Inter", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 58px 68px 52px;
    position: relative;
  }
  .top { display: flex; align-items: center; gap: 24px; }
  .brand-name {
    font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 110, "wght" 800;
    text-transform: uppercase; font-size: 30px; line-height: 1; letter-spacing: -.01em;
  }
  .brand-sub {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    letter-spacing: .42em; text-transform: uppercase; color: #FFB200; margin-top: 5px;
  }
  .title {
    font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 112, "wght" 800;
    text-transform: uppercase; font-size: 128px; line-height: .92; letter-spacing: -.02em;
  }
  .title .hl { color: #FFB200; }
  .foot {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(244,245,246,.16); padding-top: 22px;
    font-family: ui-monospace, Menlo, monospace; font-size: 17px;
    letter-spacing: .14em; text-transform: uppercase; color: #A8AEB5;
  }
  .foot b { color: #FFB200; font-weight: 400; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #FFB200; }
</style>
</head>
<body>
  <div class="top">
    <svg width="66" height="66" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <path fill="#F4F5F6" d="M12 54 L12 26 L22 10 L32 21 L42 10 L52 26 L52 54 Z"/>
      <path fill="#FFB200" d="M12 29 H52 V42 H12 Z"/>
      <circle fill="#0E1114" cx="24" cy="35.5" r="3.4"/>
      <circle fill="#0E1114" cx="40" cy="35.5" r="3.4"/>
      <path fill="#0E1114" d="M28.6 54 V47.4 A3.4 3.4 0 0 1 35.4 47.4 V54 Z"/>
    </svg>
    <div>
      <div class="brand-name">Raccoon</div>
      <div class="brand-sub">Restoration</div>
    </div>
  </div>

  <div class="title">Built for the<br><span class="hl">next</span> storm.</div>

  <div class="foot">
    <span>Roofing · Siding · Interiors · Claim Advocacy</span>
    <span><b>A+</b> BBB Accredited · Barrington, IL</span>
  </div>
  <div class="bar"></div>
</body>
</html>
